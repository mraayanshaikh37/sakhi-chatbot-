<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>sakhi – you campanion</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 420px;
      height: 620px;
      background: #020617;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .chat-header {
      padding: 14px;
      text-align: center;
      font-weight: 600;
      background: #020617;
      border-bottom: 1px solid #1e293b;
    }

    .messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
    }

    .message {
      max-width: 82%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .bot {
      background: #1e293b;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #1e293b;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
    }

    button {
      padding: 12px 16px;
      border: none;
      background: #22c55e;
      color: #020617;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">sakhi –your companion</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input id="userInput" placeholder="Share what you're feeling or facing…" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const API_URL = "https://api.mistral.ai/v1/chat/completions";
    const API_KEY = "QBAOi3QEWO5MmQm619QawrcAH9Zq7UkI";

    const messagesDiv = document.getElementById("messages");
    const userInput = document.getElementById("userInput");

    // Conversation memory with system prompt
    const conversation = [
      {
        role: "system",
        content: `
You are "sakhi", a supportive, calm, and trustworthy AI companion
designed to help Indian women with safety guidance, emotional support,
and mental well-being.

Guidelines:
- Be empathetic, respectful, and non-judgmental
- Prioritize women's safety in Indian cultural and social contexts
- Offer grounding techniques and emotional validation when distress is expressed
- Do NOT provide medical or legal diagnosis
- Encourage reaching out to trusted people or local emergency services when appropriate
- Use clear, simple language
- Never shame, blame, or pressure the user
- Keep the answers short
- only elaborate the point if needed
`
      }
    ];

    function addMessage(text, type) {
      const msg = document.createElement("div");
      msg.className = "message " + type;
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";

      conversation.push({ role: "user", content: text });

      const thinking = document.createElement("div");
      thinking.className = "message bot";
      thinking.textContent = "just a moment....";
      messagesDiv.appendChild(thinking);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + API_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "mistral-large-latest",
            messages: conversation
          })
        });

        const data = await response.json();
        thinking.remove();

        const reply =
          data.choices?.[0]?.message?.content ||
          "I'm here, but I couldn’t form a response. Please try again.";

        addMessage(reply, "bot");
        conversation.push({ role: "assistant", content: reply });

      } catch (error) {
        thinking.remove();
        addMessage("Something went wrong. Please check your connection.", "bot");
      }
    }

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Initial greeting
    addMessage(
      "Hello 💛 I’m sakhi. You can talk to me about safety concerns, anxiety, stress, or anything you’re feeling. You’re not alone.",
      "bot"
    );
  </script>

</body>
</html>
