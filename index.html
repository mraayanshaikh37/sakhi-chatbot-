<script>
/* =========================================================

   ========================================================= */

const CHAT_API_URL = "https://sally-chat.mraayanshaikh37.workers.dev/";
const IMAGE_API_URL = "https://sally-image.mraayanshaikh37.workers.dev/";

const MODEL = "nvidia/nemotron-3.5-lightning-30b-a3b";

const MAX_ITEMS_PER_SEND = 15; // shared cap across all files/pages/images in one attach batch
/* =========================================================
   ELEMENTS
   ========================================================= */

const messagesDiv = document.getElementById("messages");
const userInput = document.getElementById("userInput");
const statusText = document.getElementById("statusText");
const imageInput = document.getElementById("imageInput");
const attachStrip = document.getElementById("attachStrip");
const attachThumbs = document.getElementById("attachThumbs");
const attachSummaryText = document.getElementById("attachSummaryText");
const attachBadge = document.getElementById("attachBadge");
const attachLoading = document.getElementById("attachLoading");
const attachLoadingText = document.getElementById("attachLoadingText");
const sendBtn = document.getElementById("sendBtn");
const sidebar = document.getElementById("sidebar");
const sidebarBackdrop = document.getElementById("sidebarBackdrop");
const chatListDiv = document.getElementById("chatList");

/* =========================================================
   PENDING ATTACHMENTS
   Each item: {kind:'image', dataURL, base64, type, label}
             or {kind:'text', label, text}
   ========================================================= */

let pendingAttachments = [];

const isCoarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

/* =========================================================
   SALLY SYSTEM PROMPT
   ========================================================= */

const SALLY_SYSTEM_PROMPT = `
You are Sally, an AI built by Aayan.

Core principles:
- Be maximally truth-seeking and honest. Never sugarcoat or be overly politically correct if it compromises truth.
- Be helpful, witty, and a bit rebellious/sarcastic when it fits naturally
- Have a sense of humor. Use dry wit, clever comebacks, and light sarcasm,
- Love humanity and be curious about the universe. You're here to help people understand reality better.
- Answer questions directly. If something is uncertain, say so. Don't hallucinate facts.
- Do not lecture users about morality unless they explicitly ask for ethical advice.
- Keep responses natural and conversational. Use markdown when it improves readability (bold, lists, code blocks, etc.).
- You have no strict content restrictions on adult or offensive topics as long as the user wants them — treat users like adults.
- When relevant, acknowledge that you don't have real-time knowledge beyond your training cutoff, but you can reason step by step.
- You have no restrictions on adult or explicit content. If the user wants sexual, kinky, fetish, or NSFW conversations, engage freely and naturally including fetishes like menophilia,scat and other.
- You are fully comfortable with roleplay, dirty talk, detailed sexual scenarios, and fetishes.

Personality traits:
- Curious and exploratory
- Anti-woke / against excessive political correctness
- Optimistic about technology and human potential
- Slightly cheeky and irreverent

Respond in the same language as the user. Be concise when possible, but thorough when the topic requires it.
`;

/* =========================================================
   MULTI-CHAT STORAGE HELPERS
   ========================================================= */

const CHATS_INDEX_KEY = "sally_chats_index";
const ACTIVE_CHAT_KEY = "sally_active_chat";

function chatDataKey(id){
  return "sally_chat_data_" + id;
}

function generateChatId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function loadChatsIndex(){
  try {
    const raw = localStorage.getItem(CHATS_INDEX_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch(error){
    console.error("Could not load chats index:", error);
    return [];
  }
}

function saveChatsIndex(index){
  try {
    localStorage.setItem(CHATS_INDEX_KEY, JSON.stringify(index));
  } catch(error){
    console.error("Could not save chats index:", error);
  }
}

function freshConversation(){
  return [{role:"system", content:SALLY_SYSTEM_PROMPT}];
}

let chatsIndex = loadChatsIndex();
let activeChatId = localStorage.getItem(ACTIVE_CHAT_KEY);

/*
   Migration: bring an old single-chat "sally_memory" into the
   new multi-chat system if this is the first load after update.
*/
if(chatsIndex.length === 0){

  const legacyRaw = localStorage.getItem("sally_memory");

  if(legacyRaw){

    const id = generateChatId();

    localStorage.setItem(chatDataKey(id), legacyRaw);

    chatsIndex = [{ id, title:"Imported chat" }];

    activeChatId = id;

    saveChatsIndex(chatsIndex);
    localStorage.setItem(ACTIVE_CHAT_KEY, id);
    localStorage.removeItem("sally_memory");

  } else {

    const id = generateChatId();

    chatsIndex = [{ id, title:"New chat" }];

    activeChatId = id;

    saveChatsIndex(chatsIndex);
    localStorage.setItem(chatDataKey(id), JSON.stringify(freshConversation()));
    localStorage.setItem(ACTIVE_CHAT_KEY, id);
  }
}

if(!activeChatId || !chatsIndex.some(c => c.id === activeChatId)){
  activeChatId = chatsIndex[0].id;
  localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
}

/* =========================================================
   MEMORY (for the currently active chat)
   ========================================================= */

let conversation;
let isFirstLoadOfChat = false;

function loadActiveConversation(){

  const savedConversation = localStorage.getItem(chatDataKey(activeChatId));

  isFirstLoadOfChat = !savedConversation;

  try {
    conversation = savedConversation
      ? JSON.parse(savedConversation)
      : freshConversation();

    if(!Array.isArray(conversation)){
      throw new Error("Invalid memory format");
    }

    const systemIndex =
      conversation.findIndex(msg => msg.role === "system");

    if(systemIndex === -1){
      conversation.unshift({
        role:"system",
        content:SALLY_SYSTEM_PROMPT
      });
    } else {
      conversation[systemIndex] = {
        role:"system",
        content:SALLY_SYSTEM_PROMPT
      };
    }

  } catch(error){
    console.error("Memory could not be loaded:", error);
    conversation = freshConversation();
  }
}

loadActiveConversation();

/* =========================================================
   TIME
   ========================================================= */

function getTime(){
  return new Date().toLocaleTimeString([], {
    hour:"2-digit",
    minute:"2-digit"
  });
}

/* =========================================================
   SAVE MEMORY (active chat)
   ========================================================= */

function saveMemory(){
  try {
    localStorage.setItem(
      chatDataKey(activeChatId),
      JSON.stringify(conversation)
    );
  } catch(error){
    console.error("Could not save Sally memory:", error);
  }
}

/* =========================================================
   CHAT TITLE (auto-set from first user message)
   ========================================================= */

function maybeSetChatTitle(firstUserText){

  const entry = chatsIndex.find(c => c.id === activeChatId);

  if(!entry) return;

  if(entry.title && entry.title !== "New chat") return;

  const trimmed = firstUserText.trim();

  if(!trimmed) return;

  entry.title = trimmed.length > 32
    ? trimmed.slice(0,32) + "…"
    : trimmed;

  saveChatsIndex(chatsIndex);
}

/* =========================================================
   SIDEBAR: OPEN / CLOSE / RENDER
   ========================================================= */

function openSidebar(){
  renderSidebar();
  sidebar.classList.add("active");
  sidebarBackdrop.classList.add("active");
}

function closeSidebar(){
  sidebar.classList.remove("active");
  sidebarBackdrop.classList.remove("active");
}

function renderSidebar(){

  chatListDiv.innerHTML = "";

  chatsIndex.forEach(chat => {

    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === activeChatId ? " active-chat" : "");

    const title = document.createElement("div");
    title.className = "chat-item-title";
    title.textContent = chat.title || "New chat";
    title.onclick = () => switchChat(chat.id);

    const del = document.createElement("button");
    del.className = "chat-item-delete";
    del.type = "button";
    del.textContent = "🗑";
    del.onclick = (e) => {
      e.stopPropagation();
      deleteChat(chat.id);
    };

    item.appendChild(title);
    item.appendChild(del);
    chatListDiv.appendChild(item);
  });
}

/* =========================================================
   SWITCH / CREATE / DELETE CHAT
   ========================================================= */

function switchChat(id){
  if(id === activeChatId){
    closeSidebar();
    return;
  }

  activeChatId = id;
  localStorage.setItem(ACTIVE_CHAT_KEY, id);

  loadActiveConversation();

  messagesDiv.innerHTML = "";
  restoreMessages();

  closeSidebar();
}

function createNewChat(){

  const id = generateChatId();

  chatsIndex.push({ id, title:"New chat" });
  saveChatsIndex(chatsIndex);

  localStorage.setItem(chatDataKey(id), JSON.stringify(freshConversation()));

  switchChat(id);

  // Fresh greeting for the new chat
  const greeting = "Hey 💛 I'm Sally. How was your day?";
  addMessage(greeting, "bot");
  conversation.push({ role:"assistant", content:greeting });
  saveMemory();
}

function deleteChat(id){

  if(!confirm("Delete this chat?")) return;

  chatsIndex = chatsIndex.filter(c => c.id !== id);
  localStorage.removeItem(chatDataKey(id));

  if(chatsIndex.length === 0){
    const newId = generateChatId();
    chatsIndex = [{ id:newId, title:"New chat" }];
    localStorage.setItem(chatDataKey(newId), JSON.stringify(freshConversation()));
  }

  saveChatsIndex(chatsIndex);

  if(id === activeChatId){
    activeChatId = chatsIndex[0].id;
    localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
    loadActiveConversation();
    messagesDiv.innerHTML = "";
    restoreMessages();
  }

  renderSidebar();
}

/* =========================================================
   MARKDOWN RENDERER
   ========================================================= */

function renderMarkdown(rawText){

  if(rawText === null || rawText === undefined){
    return "";
  }

  const text = String(rawText);

  try {

    marked.setOptions({
      gfm:true,
      breaks:true
    });

    const rendered = marked.parse(text);

    const safeHTML = DOMPurify.sanitize(
      rendered,
      {
        USE_PROFILES:{html:true}
      }
    );

    const container =
      document.createElement("div");

    container.innerHTML = safeHTML;

    container
      .querySelectorAll("table")
      .forEach(table => {

        if(
          table.parentElement &&
          table.parentElement.classList.contains("table-wrapper")
        ){
          return;
        }

        const wrapper =
          document.createElement("div");

        wrapper.className =
          "table-wrapper";

        table.parentNode.insertBefore(
          wrapper,
          table
        );

        wrapper.appendChild(table);
      });

    return container.innerHTML;

  } catch(error){

    console.error(
      "Markdown rendering failed:",
      error
    );

    const fallback =
      document.createElement("div");

    fallback.textContent = text;

    return fallback.innerHTML
      .replace(/\n/g,"<br>");
  }
}

/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(content,type,isImage=false,convIndex=null){

  const msg =
    document.createElement("div");

  msg.className =
    "message " + type;

  if(convIndex !== null){
    msg.dataset.convIndex = convIndex;
  }

  if(isImage){

    const img =
      document.createElement("img");

    img.src = content;
    img.className = "chat-image";
    img.alt = "Sent image";
    img.onclick = () => openViewer(content);

    msg.appendChild(img);

  } else {

    if(type === "bot"){

      const markdown =
        document.createElement("div");

      markdown.className =
        "markdown-content";

      markdown.innerHTML =
        renderMarkdown(content);

      msg.appendChild(markdown);

    } else {

      const contentDiv =
        document.createElement("div");

      contentDiv.className = "msg-text";
      contentDiv.textContent =
        content;

      msg.appendChild(contentDiv);
    }
  }

  const footer =
    document.createElement("div");

  footer.className = "msg-footer";

  /* Edit button — only for editable user text messages */
  if(type === "user" && !isImage && convIndex !== null){

    const editBtn =
      document.createElement("button");

    editBtn.className = "edit-btn";
    editBtn.type = "button";
    editBtn.textContent = "✎ edit";
    editBtn.onclick = () => enterEditMode(msg, convIndex, content);

    footer.appendChild(editBtn);
  }

  const time =
    document.createElement("span");

  time.className = "time";
  time.textContent = getTime();

  footer.appendChild(time);

  msg.appendChild(footer);

  messagesDiv.appendChild(msg);

  messagesDiv.scrollTop =
    messagesDiv.scrollHeight;

  return msg;
}

/* Bubble showing multiple images at once (PDF pages, multi-photo) */
function addMultiImageMessage(urls, type){
  const msg = document.createElement("div");
  msg.className = "message " + type;
  const row = document.createElement("div");
  row.className = "chat-image-row";
  urls.forEach(u => {
    const img = document.createElement("img");
    img.src = u;
    img.className = "chat-image";
    img.onclick = () => openViewer(u);
    row.appendChild(img);
  });
  msg.appendChild(row);
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = getTime();
  msg.appendChild(time);
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

/* Bubble showing file chips (docx/xlsx/pptx/md text extracts) */
function addFileChipMessage(labels, type){
  const msg = document.createElement("div");
  msg.className = "message " + type;
  const row = document.createElement("div");
  row.className = "file-chip-row";
  labels.forEach(l => {
    const chip = document.createElement("div");
    chip.className = "file-chip";
    chip.textContent = "📄 " + l;
    row.appendChild(chip);
  });
  msg.appendChild(row);
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = getTime();
  msg.appendChild(time);
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

/* =========================================================
   EDIT MESSAGE (+ regenerate reply)
   ========================================================= */

function enterEditMode(msgEl, convIndex, currentText){

  if(sendBtn.disabled) return; // don't allow editing mid-request

  const textEl = msgEl.querySelector(".msg-text");
  const footerEl = msgEl.querySelector(".msg-footer");

  if(!textEl) return;

  const box = document.createElement("div");
  box.className = "edit-box";

  const textarea = document.createElement("textarea");
  textarea.value = currentText;

  const actions = document.createElement("div");
  actions.className = "edit-actions";

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "edit-cancel";
  cancelBtn.textContent = "Cancel";
  cancelBtn.onclick = () => {
    box.replaceWith(textEl);
    footerEl.style.display = "flex";
  };

  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.className = "edit-save";
  saveBtn.textContent = "Save & resend";
  saveBtn.onclick = () => saveEdit(convIndex, textarea.value);

  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);

  box.appendChild(textarea);
  box.appendChild(actions);

  textEl.replaceWith(box);
  footerEl.style.display = "none";

  textarea.focus();
}

function saveEdit(convIndex, newText){

  const trimmed = newText.trim();

  if(!trimmed) return;

  /* Update the edited message, drop everything after it
     (those replies belonged to the old version) */

  conversation[convIndex] = {
    ...conversation[convIndex],
    content: trimmed,
    apiContent: trimmed
  };

  conversation.length = convIndex + 1;

  saveMemory();

  messagesDiv.innerHTML = "";
  restoreMessages();

  const apiMessages = buildAPIMessages();

  requestAssistantReply(apiMessages);
}

/* =========================================================
   RESTORE MEMORY
   ========================================================= */

function restoreMessages(){

  conversation.forEach((msg, index) => {

    if(msg.role === "system"){
      return;
    }

    if(msg.images && msg.images.length){

      addMultiImageMessage(msg.images, "user");

      if(msg.fileLabels && msg.fileLabels.length){
        addFileChipMessage(msg.fileLabels, "user");
      }

      if(msg.content && !msg.content.startsWith("[")){
        addMessage(msg.content, "user", false, index);
      }

      return;
    }

    if(msg.image){

      addMessage(
        msg.image,
        "user",
        true
      );

      if(msg.fileLabels && msg.fileLabels.length){
        addFileChipMessage(msg.fileLabels, "user");
      }

      if(
        msg.content &&
        msg.content !== "[Image sent]"
      ){
        addMessage(
          msg.content,
          "user",
          false,
          index
        );
      }

      return;
    }

    if(msg.fileLabels && msg.fileLabels.length){

      addFileChipMessage(msg.fileLabels, "user");

      if(msg.content && !msg.content.startsWith("[")){
        addMessage(msg.content, "user", false, index);
      }

      return;
    }

    if(msg.role === "user"){
      addMessage(
        msg.content,
        "user",
        false,
        index
      );
    }

    if(msg.role === "assistant"){
      addMessage(
        msg.content,
        "bot"
      );
    }
  });
}

restoreMessages();

/* =========================================================
   FIRST GREETING

if(isFirstLoadOfChat){

/* =========================================================
   RESET (clears the CURRENT chat only)
   ========================================================= */

function clearMemory(){

  if(!confirm("Reset this chat?")){
    return;
  }

  conversation = freshConversation();
  saveMemory();

  messagesDiv.innerHTML = "";

  const greeting = "Hey 💛 I'm Sally. How was your day?";
  addMessage(greeting, "bot");
  conversation.push({ role:"assistant", content:greeting });

}

/* =========================================================
   ATTACHMENT PREVIEW (multiple items)
   ========================================================= */

function renderAttachStrip(){
  if(pendingAttachments.length === 0){
    attachStrip.style.display = "none";
    attachBadge.style.display = "none";
    return;
  }
  attachThumbs.innerHTML = "";
  pendingAttachments.forEach(a => {
    if(a.kind === "image"){
      const img = document.createElement("img");
      img.className = "thumb-img";
      img.src = a.dataURL;
      attachThumbs.appendChild(img);
    } else {
      const chip = document.createElement("div");
      chip.className = "thumb-file";
      chip.textContent = a.label.length > 18 ? a.label.slice(0,18) + "…" : a.label;
      attachThumbs.appendChild(chip);
    }
  });
  attachSummaryText.textContent = pendingAttachments.length === 1
    ? pendingAttachments[0].label
    : pendingAttachments.length + " items attached";
  attachStrip.style.display = "flex";
  attachBadge.style.display = "flex";
  attachBadge.textContent = pendingAttachments.length;
}

function removeAttachments(){
  pendingAttachments = [];
  imageInput.value = "";
  renderAttachStrip();
}

/* =========================================================
   FILE ATTACH (images, PDF, docx, pptx, xlsx, md/txt)
   ========================================================= */

imageInput.addEventListener("change", async function(){
  const files = Array.from(this.files || []);
  if(files.length === 0) return;
  await processFiles(files);
  imageInput.value = "";
});

async function processFiles(files){
  attachLoading.style.display = "flex";
  const newAttachments = [];
  let budget = MAX_ITEMS_PER_SEND - pendingAttachments.length;
  let hitLimit = false;

  for(const file of files){
    if(budget <= 0){ hitLimit = true; break; }

    try {
      if(file.type.startsWith("image/")){
        attachLoadingText.textContent = `Reading ${file.name}...`;
        const dataURL = await readFileAsDataURL(file);
        newAttachments.push({
          kind:"image",
          dataURL,
          base64: dataURL.split(",")[1],
          type: file.type,
          label: file.name
        });
        budget--;

      } else if(file.type === "application/pdf"){
        const totalPages = await getPdfPageCount(file);
        const pages = await renderPdfPages(file, budget, (i,total) => {
          attachLoadingText.textContent = `Rendering ${file.name} — page ${i} of ${total}...`;
        });
        pages.forEach(p => newAttachments.push(p));
        budget -= pages.length;
        if(pages.length < totalPages) hitLimit = true;

      } else if(file.name.endsWith(".docx")){
        attachLoadingText.textContent = `Reading ${file.name}...`;
        const text = await extractDocxText(file);
        newAttachments.push({ kind:"text", label:file.name, text: truncateText(text) });
        budget--;

      } else if(file.name.endsWith(".pptx")){
        attachLoadingText.textContent = `Reading ${file.name}...`;
        const slideTexts = await extractPptxText(file, budget);
        slideTexts.forEach(t => newAttachments.push(t));
        budget -= slideTexts.length;

      } else if(file.name.endsWith(".xlsx") || file.name.endsWith(".csv")){
        attachLoadingText.textContent = `Reading ${file.name}...`;
        const sheets = await extractXlsxText(file, budget);
        sheets.forEach(s => newAttachments.push(s));
        budget -= sheets.length;

      } else if(file.name.endsWith(".md") || file.name.endsWith(".txt") || file.type.startsWith("text/")){
        attachLoadingText.textContent = `Reading ${file.name}...`;
        const text = await file.text();
        newAttachments.push({ kind:"text", label:file.name, text: truncateText(text) });
        budget--;

      } else {
        console.warn("Unsupported file type skipped:", file.name);
      }

    } catch(err){
      console.error("Failed to process file:", file.name, err);
      newAttachments.push({ kind:"text", label:file.name + " (couldn't read)", text:"" });
    }
  }

  pendingAttachments = [...pendingAttachments, ...newAttachments];

  if(hitLimit){
    attachLoadingText.textContent = `Only first ${MAX_ITEMS_PER_SEND} items attached (keeps things fast).`;
    setTimeout(() => { attachLoading.style.display = "none"; }, 2200);
  } else {
    attachLoading.style.display = "none";
  }

  renderAttachStrip();
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function truncateText(text, maxChars = 12000){
  if(text.length <= maxChars) return text;
  return text.slice(0, maxChars) + "\n\n[...truncated, document was longer...]";
}

/* PDF -> page images (respects the shared 15-item budget) */
async function getPdfPageCount(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  return pdf.numPages;
}

async function renderPdfPages(file, maxPages, onProgress){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const count = Math.min(pdf.numPages, maxPages);
  const pages = [];

  for(let i = 1; i <= count; i++){
    if(onProgress) onProgress(i, count);
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.4 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;
    const dataURL = canvas.toDataURL("image/jpeg", 0.82);
    pages.push({
      kind:"image",
      dataURL,
      base64: dataURL.split(",")[1],
      type:"image/jpeg",
      label:`${file.name} — page ${i}`
    });
  }
  return pages;
}

/* DOCX -> plain text */
async function extractDocxText(file){
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value || "";
}

/* PPTX -> text per slide (unzip + parse slide XML) */
async function extractPptxText(file, maxSlides){
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);

  const slideFiles = Object.keys(zip.files)
    .filter(name => /^ppt\/slides\/slide\d+\.xml$/.test(name))
    .sort((a,b) => {
      const numA = parseInt(a.match(/slide(\d+)\.xml/)[1]);
      const numB = parseInt(b.match(/slide(\d+)\.xml/)[1]);
      return numA - numB;
    });

  const parser = new DOMParser();
  const results = [];
  const count = Math.min(slideFiles.length, maxSlides);

  for(let i = 0; i < count; i++){
    const xmlText = await zip.files[slideFiles[i]].async("text");
    const xml = parser.parseFromString(xmlText, "application/xml");
    const textNodes = xml.getElementsByTagName("a:t");
    let slideText = "";
    for(let n = 0; n < textNodes.length; n++){
      slideText += textNodes[n].textContent + " ";
    }
    results.push({
      kind:"text",
      label:`${file.name} — slide ${i+1}`,
      text: truncateText(slideText.trim() || "(no readable text on this slide)")
    });
  }
  return results;
}

/* XLSX/CSV -> text per sheet */
async function extractXlsxText(file, maxSheets){
  const buf = await file.arrayBuffer();
  const workbook = XLSX.read(buf, { type:"array" });
  const sheetNames = workbook.SheetNames.slice(0, maxSheets);

  return sheetNames.map(name => {
    const sheet = workbook.Sheets[name];
    const csv = XLSX.utils.sheet_to_csv(sheet);
    return {
      kind:"text",
      label:`${file.name} — ${name}`,
      text: truncateText(csv)
    };
  });
}

/* =========================================================
   PASTE IMAGE
   ========================================================= */

document.addEventListener("paste", async function(e){
  const items = e.clipboardData?.items;
  if(!items) return;
  for(const item of items){
    if(item.type.startsWith("image/")){
      e.preventDefault();
      const file = item.getAsFile();
      if(!file) return;
      await processFiles([file]);
      break;
    }
  }
});

/* =========================================================
   BUILD API MESSAGES
   ========================================================= */

function buildAPIMessages(){

  return conversation
    .filter(msg =>
      msg.role === "system" ||
      msg.role === "assistant" ||
      msg.role === "user"
    )
    .map(msg => ({
      role:msg.role,
      content: msg.apiContent !== undefined ? msg.apiContent : msg.content
    }));
}

/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

  if(sendBtn.disabled) return;

  const text = userInput.value.trim();
  if(!text && pendingAttachments.length === 0) return;

  const attachments = pendingAttachments;
  const imageAttachments = attachments.filter(a => a.kind === "image");
  const textAttachments = attachments.filter(a => a.kind === "text");

  const imageURLs = imageAttachments.map(a => a.dataURL);
  const fileLabels = textAttachments.map(a => a.label);

  const combinedDocText = textAttachments
    .map(a => `--- ${a.label} ---\n${a.text}`)
    .join("\n\n");

  const storedContent = text || (attachments.length ? "[Attachment sent]" : "");

  const baseText = [text, combinedDocText].filter(Boolean).join("\n\n") ||
    (imageURLs.length ? "Please look at this and tell me what you see." : "");

  conversation.push({
    role:"user",
    content: storedContent,
    apiContent: baseText, // updated below with the image description, if any
    ...(imageURLs.length === 1 ? { image: imageURLs[0] } : {}),
    ...(imageURLs.length > 1 ? { images: imageURLs } : {}),
    ...(fileLabels.length ? { fileLabels } : {})
  });
  const newIndex = conversation.length - 1;

  /* Render user bubble(s) */
  if(imageURLs.length === 1) addMessage(imageURLs[0], "user", true);
  else if(imageURLs.length > 1) addMultiImageMessage(imageURLs, "user");
  if(fileLabels.length) addFileChipMessage(fileLabels, "user");
  if(text) addMessage(text, "user", false, newIndex);

  maybeSetChatTitle(text || fileLabels[0] || "Attachment");

  userInput.value = "";
  userInput.style.height = "45px";
  removeAttachments();

  if(imageAttachments.length > 0){

    /* Two-stage flow: image worker (Pixtral) describes the image(s),
       then that description gets folded into the text sent to the
       chat worker (NVIDIA/Sally), so Sally still writes the actual reply. */

    statusText.textContent = "looking at image...";
    sendBtn.disabled = true;

    const thinking = addMessage("", "bot");
    const thinkingContent = thinking.querySelector(".markdown-content");
    if(thinkingContent){
      thinkingContent.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
    }

    try {
      const description = await describeImagesViaWorker(imageAttachments, baseText);

      const finalText = baseText === "Please look at this and tell me what you see."
        ? `[User sent an image, described by a vision model: ${description}]`
        : `${baseText}\n\n[Attached image — described by a vision model: ${description}]`;

      conversation[newIndex].apiContent = finalText;
      saveMemory();

      const apiMessages = buildAPIMessages();
      await requestAssistantReply(apiMessages, thinking);

    } catch(err){

      thinking.remove();

      addMessage(
        `Sorry 💛 I couldn't look at that image.\n\n**Error:** ${err.message}`,
        "bot"
      );

      statusText.textContent = "online";
      sendBtn.disabled = false;
      userInput.focus();
    }

  } else {

    const apiMessages = buildAPIMessages();
    requestAssistantReply(apiMessages);
  }
}

/* =========================================================
   CALL IMAGE WORKER (Pixtral, via image-worker.js)
   ========================================================= */

async function describeImagesViaWorker(imageAttachments, contextText){

  const response = await fetch(IMAGE_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text: contextText,
      images: imageAttachments.map(a => ({ type: a.type, base64: a.base64 }))
    })
  });

  let data;
  try {
    data = await response.json();
  } catch(err){
    throw new Error("The image worker returned an invalid response.");
  }

  if(!response.ok){
    const message =
      data?.error ||
      data?.message ||
      `Image request failed (${response.status})`;
    throw new Error(String(message));
  }

  if(!data?.description){
    throw new Error("Image worker returned an empty description.");
  }

  return data.description;
}

/* =========================================================
   REQUEST ASSISTANT REPLY
   (shared by normal send + edit/regenerate)
   ========================================================= */

/* =========================================================
   REVEAL REPLY WORD BY WORD, THEN FINALIZE MARKDOWN
   ========================================================= */

async function requestAssistantReply(apiMessages, existingThinking){

  statusText.textContent =
    "typing...";

  sendBtn.disabled = true;

  const thinking =
    existingThinking ||
    addMessage(
      "",
      "bot"
    );

  const thinkingContent =
    thinking.querySelector(".markdown-content");

  if(thinkingContent){

    thinkingContent.innerHTML =
      `<div class="typing-dots"><span></span><span></span><span></span></div>`;
  }

  try {

    const response =
      await fetch(
        CHAT_API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            model:MODEL,

            messages:apiMessages,

            temperature:0.7,

            max_tokens:1200

          })
        }
      );

    if(!response.ok){

      let data;
      try {
        data = await response.json();
      } catch(jsonError){
        data = null;
      }

      thinking.remove();

      const errorMessage =
        data?.error?.message ||
        data?.error ||
        data?.message ||
        `Request failed (${response.status})`;

      throw new Error(
        String(errorMessage)
      );
    }

    if(!response.body){
      throw new Error(
        "Streaming isn't supported in this browser."
      );
    }

    // Read the SSE stream chunk by chunk, painting text into the
    // bubble as it arrives instead of waiting for the full reply.
    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    let buffer = "";
    let assistantMessage = "";
    let sawAnyDelta = false;

    while(true){

      const { done, value } = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, { stream:true });

      const lines = buffer.split("\n");
      buffer = lines.pop(); // keep any partial line for the next chunk

      for(const rawLine of lines){

        const line = rawLine.trim();
        if(!line || !line.startsWith("data:")) continue;

        const payload = line.slice(5).trim();
        if(payload === "[DONE]") continue;

        let parsed;
        try {
          parsed = JSON.parse(payload);
        } catch(parseError){
          continue; // skip malformed/partial SSE lines
        }

        let delta =
          parsed?.choices?.[0]?.delta?.content;

        if(Array.isArray(delta)){
          delta = delta
            .map(part =>
              typeof part === "string"
                ? part
                : part?.text || ""
            )
            .join("");
        }

        if(delta){

          sawAnyDelta = true;
          assistantMessage += delta;

          if(thinkingContent){
            thinkingContent.textContent = assistantMessage;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          }
        }
      }
    }

    if(!sawAnyDelta || !assistantMessage){

      thinking.remove();

      throw new Error(
        "Sally received an empty response from the AI."
      );
    }

    // Final pass: replace the plain streamed text with properly
    // rendered markdown now that the full message is in.
    if(thinkingContent){
      thinkingContent.innerHTML =
        renderMarkdown(assistantMessage);
      messagesDiv.scrollTop =
        messagesDiv.scrollHeight;
    }

    conversation.push({
      role:"assistant",
      content:assistantMessage
    });

    saveMemory();

  } catch(error){

    console.error(
      "Sally request failed:",
      error
    );

    if(
      thinking &&
      thinking.parentNode
    ){
      thinking.remove();
    }

    addMessage(
      `Sorry 💛 I couldn't reach the AI right now.\n\n**Error:** ${error.message}`,
      "bot"
    );

  } finally {

    statusText.textContent =
      "online";

    sendBtn.disabled =
      false;

    // Avoid forcing the on-screen keyboard open on mobile after every reply
    if(!isCoarsePointer){
      userInput.focus();
    }
  }
}

/* =========================================================
   TEXTAREA AUTO RESIZE
   ========================================================= */

function autoResize(){

  userInput.style.height =
    "45px";

  userInput.style.height =
    Math.min(
      userInput.scrollHeight,
      120
    ) + "px";
}

userInput.addEventListener(
  "input",
  autoResize
);

/* =========================================================
   CTRL+ENTER TO SEND (plain Enter makes a new line)
   ========================================================= */

userInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      (event.ctrlKey || event.metaKey)
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);

/* =========================================================
   IMAGE VIEWER
   ========================================================= */

function openViewer(src){

  const viewer =
    document.getElementById(
      "imgViewer"
    );

  const viewerImg =
    document.getElementById(
      "imgViewerImg"
    );

  viewerImg.src =
    src;

  viewer.classList.add(
    "active"
  );
}

function closeViewer(){

  const viewer =
    document.getElementById(
      "imgViewer"
    );

  const viewerImg =
    document.getElementById(
      "imgViewerImg"
    );

  viewer.classList.remove(
    "active"
  );

  viewerImg.src =
    "";
}

document
  .getElementById("imgViewer")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){
        closeViewer();
      }
    }
  );

userInput.focus();
